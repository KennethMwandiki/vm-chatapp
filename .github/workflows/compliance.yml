name: compliance-checks

on:
  pull_request:
  push:
    branches: [ main, release/* ]

jobs:
  spdx-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SPDX headers
        run: |
          missing=$(git ls-files | grep -E '\.(js|ts|tsx|jsx)$' | \
            xargs -I{} sh -c 'grep -q "SPDX-License-Identifier: Apache-2.0" "{}" || echo "{}"' || true)
          if [ -n "$missing" ]; then
            echo "❌ Files missing SPDX header:"
            echo "$missing"
            exit 1
          fi

  vite-version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Vite version
        run: |
          vite_version=$(node -p "require('./package.json').devDependencies.vite")
          echo "Detected Vite version: $vite_version"
          if [[ "$vite_version" =~ ^7 ]]; then
            echo "❌ Vite 7.x detected — not supported"
            exit 1

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM
        run: npx @cyclonedx/cyclonedx-npm --output sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
