name: CI/CD with Smoke Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20
    - name: Install dependencies
      run: npm install
    - name: Run tests
      run: npm test

    - name: Log in to GitHub Container Registry
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and tag Docker images
      run: |
        # Use lowercase for the repository owner and name in the image tag
        OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        docker build -f Dockerfile.backend -t ghcr.io/$OWNER/vm-chatapp-backend:latest .
        docker build -f Dockerfile.frontend -t ghcr.io/$OWNER/vm-chatapp-frontend:latest .

    - name: Push Docker images to GitHub Container Registry
      if: github.ref == 'refs/heads/main'
      run: |
        OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
        docker push ghcr.io/$OWNER/vm-chatapp-backend:latest
        docker push ghcr.io/$OWNER/vm-chatapp-frontend:latest

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Create or update Kubernetes secret
        run: |
          kubectl create secret generic vm-chatapp-secrets \
            --from-literal=SESSION_SECRET='${{ secrets.SESSION_SECRET }}' \
            --from-literal=GOOGLE_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID }}' \
            --from-literal=GOOGLE_CLIENT_SECRET='${{ secrets.GOOGLE_CLIENT_SECRET }}' \
            --from-literal=MONGO_URI='${{ secrets.MONGO_URI }}' \
            --from-literal=VITE_AGORA_APP_ID='${{ secrets.VITE_AGORA_APP_ID }}' \
            --from-literal=AGORA_APP_ID='${{ secrets.VITE_AGORA_APP_ID }}' \
            --from-literal=BASE_URL='${{ secrets.BASE_URL }}' \
            -o yaml --dry-run=client | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/

  smoke-test:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check application health
        run: |
          echo "Pinging health endpoint at ${{ secrets.BASE_URL }}/api/healthz"
          # Wait a moment for services to be fully available after ingress update
          sleep 20
          curl -f --connect-timeout 10 --max-time 20 "${{ secrets.BASE_URL }}/api/healthz"